# One process per container. asterisk, freepbx-init, freepbx and fastagi share one
# network namespace, owned by the pbx-net pause container exactly like a Kubernetes Pod:
# FreePBX reaches AMI and Asterisk reaches FastAGI on 127.0.0.1, as on a single host,
# and any of them can restart without breaking the others' networking. Config and
# state are shared through named volumes.

x-db-env: &db-env
  DB_HOST: ${DB_HOST:-db}
  DB_PORT: ${DB_PORT:-3306}
  DB_NAME: asterisk
  CDR_DB_NAME: asteriskcdrdb
  DB_USER: freepbxuser
  DB_PASSWORD_FILE: /run/secrets/freepbxuser_password
  AMI_USER: freepbx-docker
  AMI_PASSWORD_FILE: /run/secrets/ami_password
  SMTP_FROM: ${SMTP_FROM:-freepbx@freepbx.localdomain}

x-freepbx-volumes: &freepbx-volumes
  - asterisk_etc:/etc/asterisk
  - asterisk_lib:/var/lib/asterisk
  - asterisk_spool:/var/spool/asterisk
  - asterisk_log:/var/log/asterisk
  - freepbx_web:/var/www/html
  - freepbx_conf:/var/lib/freepbx
  - freepbx_crontabs:/var/spool/cron/crontabs
  - freepbx_run:/var/run/asterisk

volumes:
  mysql_data:
  asterisk_etc:
  asterisk_lib:
  asterisk_spool:
  asterisk_log:
  freepbx_web:
  freepbx_conf:
  freepbx_crontabs:
  freepbx_run:
  smtp_spool:
  caddy_data:
  caddy_config:

networks:
  defaultnet:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: freepbxint
    ipam:
      driver: default
      config:
        - subnet: ${PBX_SUBNET:-172.18.0.0/16}
          gateway: ${PBX_GATEWAY:-172.18.0.1}

secrets:
  mysql_root_password:
    file: mysql_root_password.txt
  freepbxuser_password:
    file: freepbxuser_password.txt
  ami_password:
    file: ami_password.txt
  smtp_password:
    file: smtp_password.txt

services:
  db:
    restart: always
    image: mariadb:10.11.19@sha256:0d0945c57f75b3a3b9ebe71aedaaad005fa5305054e8fca3d2e42a8c92b43b5e
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
      MYSQL_USER: freepbxuser
      MYSQL_PASSWORD_FILE: /run/secrets/freepbxuser_password
    secrets:
      - mysql_root_password
      - freepbxuser_password
    volumes:
      - mysql_data:/var/lib/mysql
      - ./my.cnf:/etc/mysql/my.cnf:ro
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      defaultnet:

  # Holds the shared network namespace (IP, published ports) for the PBX containers.
  pbx-net:
    restart: always
    image: registry.k8s.io/pause:3.10.1@sha256:278fb9dbcca9518083ad1e11276933a2e96f23de604a3a08cc3c80002767d24c
    networks:
      defaultnet:
        # Fixed so run.sh can DNAT the RTP port range to it
        ipv4_address: ${PBX_IP:-172.18.0.20}
        aliases: [asterisk, freepbx]
    ports:
      - "5060:5060/udp"

  asterisk:
    restart: always
    image: ${ASTERISK_IMAGE:-ghcr.io/bchrobot/freepbx-docker/asterisk:latest}
    build:
      context: ./source
      target: asterisk
    environment: *db-env
    secrets:
      - freepbxuser_password
      - ami_password
    volumes:
      - asterisk_etc:/etc/asterisk
      - asterisk_lib:/var/lib/asterisk
      - asterisk_spool:/var/spool/asterisk
      - asterisk_log:/var/log/asterisk
      # AGI scripts run FreePBX code, read-only
      - freepbx_web:/var/www/html:ro
      - freepbx_conf:/var/lib/freepbx:ro
    network_mode: service:pbx-net
    depends_on:
      pbx-net:
        condition: service_started
        restart: true
      db:
        condition: service_healthy

  freepbx-init:
    image: ${FREEPBX_IMAGE:-ghcr.io/bchrobot/freepbx-docker/freepbx:latest}
    build:
      context: ./source
      target: freepbx
    command: ["freepbx-init"]
    restart: "no"
    network_mode: service:pbx-net
    environment:
      <<: *db-env
      FREEPBX_AUTO_UPGRADE: ${FREEPBX_AUTO_UPGRADE:-false}
      FREEPBX_NOTIFICATION_EMAIL: ${FREEPBX_NOTIFICATION_EMAIL:-}
      RTP_START: ${RTP_START:-16384}
      RTP_END: ${RTP_END:-32767}
    secrets:
      - freepbxuser_password
      - ami_password
    volumes: *freepbx-volumes
    depends_on:
      db:
        condition: service_healthy
      asterisk:
        condition: service_healthy

  freepbx:
    restart: always
    image: ${FREEPBX_IMAGE:-ghcr.io/bchrobot/freepbx-docker/freepbx:latest}
    build:
      context: ./source
      target: freepbx
    network_mode: service:pbx-net
    environment: *db-env
    secrets:
      - freepbxuser_password
      - ami_password
    volumes: *freepbx-volumes
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1/admin/config.php"]
      interval: 30s
      timeout: 5s
      start_period: 20s
    depends_on:
      freepbx-init:
        condition: service_completed_successfully

  # FreePBX's FastAGI server: runs AGI scripts for Asterisk on 127.0.0.1:4573
  fastagi:
    restart: always
    image: ${FREEPBX_IMAGE:-ghcr.io/bchrobot/freepbx-docker/freepbx:latest}
    build:
      context: ./source
      target: freepbx
    command: ["fastagi"]
    network_mode: service:pbx-net
    environment: *db-env
    secrets:
      - freepbxuser_password
      - ami_password
    volumes: *freepbx-volumes
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/4573"]
      interval: 30s
      timeout: 5s
    depends_on:
      freepbx-init:
        condition: service_completed_successfully

  # FreePBX's crontab (fwconsole job --run: module security updates, etc.) and logrotate
  cron:
    restart: always
    image: ${CRON_IMAGE:-ghcr.io/bchrobot/freepbx-docker/cron:latest}
    build:
      context: ./source
      target: cron
    network_mode: service:pbx-net
    environment: *db-env
    secrets:
      - freepbxuser_password
      - ami_password
    volumes: *freepbx-volumes
    depends_on:
      freepbx-init:
        condition: service_completed_successfully

  # Send-only relay; the PBX containers hand mail to it with msmtp (sendmail).
  smtp:
    restart: always
    image: ${SMTP_IMAGE:-ghcr.io/bchrobot/freepbx-docker/smtp:latest}
    build:
      context: ./source
      target: smtp
    environment:
      # smtp exits with an error until this is set in .env
      RELAYHOST: ${SMTP_RELAYHOST:-}
      RELAYHOST_USERNAME: ${SMTP_RELAY_USER:-}
      RELAYHOST_PASSWORD_FILE: /run/secrets/smtp_password
      MAIL_HOSTNAME: ${MAIL_HOSTNAME:-freepbx.localdomain}
      MYNETWORKS: 127.0.0.0/8 ${PBX_SUBNET:-172.18.0.0/16}
    secrets:
      - smtp_password
    volumes:
      - smtp_spool:/var/spool/postfix
    networks:
      defaultnet:

  # TLS edge for the web UI; replaceable by a cloud load balancer.
  proxy:
    restart: always
    image: caddy:2.11.7@sha256:504a44d7d74bd2bc28a66afc4774912fc21223ca8a67734af1c54ab2f999b489
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80/tcp"
      - "443:443/tcp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      defaultnet:
    depends_on:
      freepbx:
        condition: service_healthy

  fail2ban:
    restart: unless-stopped
    image: lscr.io/linuxserver/fail2ban:1.1.0@sha256:6d04e983661436f0080675a5b8cbecf07e00126266edd12b5a8c1fa49c8ecec0
    container_name: fail2ban
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      PUID: 1000
      PGID: 2000
      TZ: UTC
    volumes:
      - asterisk_log:/remotelogs/asterisk:ro
      - ./source/fail2ban/jail.local:/config/fail2ban/jail.local
      - ./source/fail2ban/filter.d/asterisk.conf:/config/fail2ban/filter.d/asterisk.conf
    depends_on:
      - asterisk
