# Weekly from-scratch rebuild. Dependabot cannot see apt packages (PHP, Apache,
# ODBC, ...), so Debian security fixes only reach the image when it is rebuilt.
name: rebuild

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rebuild:
    permissions:
      contents: read
      packages: write
      security-events: write
    uses: ./.github/workflows/build.yml
    with:
      no-cache: true
      fail-on-vulns: true

  report:
    needs: rebuild
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const title = 'Weekly rebuild: fixable HIGH/CRITICAL vulnerabilities';
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `The scheduled rebuild found fixable vulnerabilities (or failed to build).\n\nRun: ${run}\n\nFindings are in the Security tab under code scanning (category \`image\`).`;
            const { data: open } = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', labels: 'security', per_page: 100,
            });
            const existing = open.find((i) => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ ...context.repo, title, body, labels: ['security'] });
            }
